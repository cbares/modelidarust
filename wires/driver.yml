    type: Dupont 2.54 6x2
    subtype: female
    pinlabels: [V+, V+, GND, GND, IN1B, IN1A, IN2B, IN2A, ENB, ENA, CTB, CTA]

  CN10-1-12:
    pincount: 12
    type: Dupont 2.54 6x2
    subtype: female
    pinlabels: [PC9, PC8, PB8,PC6, PB9, PC5, AVDD, U5V, GND, NC,PA5, PA12]

  CN10-13-24:
    pincount: 12
    type: Dupont 2.54 6x2
    subtype: female
    pinlabels: [PA6, PA11, PA7, PB12, PB6, NC, PC7, GND, PA9, PB2, PA8, PB1]
  CN10-25-38:
