    pinlabels: [PA15, +5V, GND, GND]
  CN7-27-30:
    pincount: 4
    type: Dupont 2.54 2x2
    subtype: female
    pinlabels: [PC15, PA0, PH0, PA1] 
  encoder-right:
    pincount: 4
