[package]
name = "modelidar"
version = "0.1.0"
edition = "2024"


[features]
default = ["stm32f446re","qei-tim2", "qei-tim5" ]
stm32f446re = ["embassy-stm32/stm32f446re"]
stm32f411re = ["embassy-stm32/stm32f411re"]
stm32f410rb = ["embassy-stm32/stm32f410rb"]
# qei features for different timers, exactly two should be enabled at a time
qei-tim1 = []
qei-tim2 = []
qei-tim3 = []
qei-tim4 = []
qei-tim5 = []
qei-tim9 = []


[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embassy-sync = {version = "0.8.0", features = ["defmt"] }
embassy-executor = {version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = {version = "0.5.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
] }

defmt = "1.0.1"
defmt-rtt = "1.1.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

heapless = { version = "0.9.2", default-features = false }

embassy-futures = "0.1.2"
mpu9250 = {version = "0.25.0", features = ["i2c"] }
mpu6050-dmp = {version = "0.6.1", features = ["async"] }

embedded-io-async = "0.7.0"
static_cell = "2.1.1"


motor-driver-hal = { version = "0.1.3", default-features = false}

[dependencies.embassy-stm32]
 version = "0.6.0"
 features = [ "rt", # (enabled by default) —  Enable stm32-metapac’s rt feature
     # "stm32f446re",
     "time", #  Enable the time driver
     "time-driver-any",
     # "time-driver-tim1", # force TIM1, insteade of TIM4 choosen by default by time-driver-any
     "exti",
     # "dual-bank", #  Enable dual-bank support (if available on the target)
     "defmt", # Use defmt for logging
     # "log", #  Use log for logging
     "chrono", #  Enable chrono support
     # "cyw43", #  Enable cyw (wifi/bluetooth) support (if available on the target)
     # "executor-thread", #  Enable the thread-mode low-power executor.
     # "executor-interrupt", #  Enable the interrupt-mode low-power executor.
     "memory-x", #  Automatically generate memory.x file based on the memory map from stm32-metapac
     # "trustzone-secure", #  Use secure registers when TrustZone is enabled
     "unstable-pac", #  Re-export stm32-metapac at embassy_stm32::pac.
     # "unchecked-overclocking",
     # "low-power",
     ]

# cargo build/run
 [profile.dev]
 # default is opt-level = '0', but that makes very
 # verbose machine code
 opt-level = 's'
 # trade compile speed for slightly better optimizations
 codegen-units = 1
 lto = false
 debug = true

 # cargo build/run --release
 [profile.release]
 # default is opt-level = '3', but that makes quite
 # verbose machine code
 opt-level = 's'
 # trade compile speed for slightly better optimizations
 codegen-units = 1
 # Use Link Time Optimizations to further inline things across
 # crates
 lto = 'fat'
 # Leave the debug symbols in (default is no debug info)
 debug = 2