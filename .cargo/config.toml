[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# La puce vient de PROBE_RS_CHIP (défini dans [env], surchargeable depuis le shell).
runner = ["probe-rs", "run"]

linker = "flip-link"

rustflags = [
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
]

[env]
DEFMT_LOG = "info"
# Valeur par défaut ; une variable déjà présente dans le shell est prioritaire.
PROBE_RS_CHIP = "STM32F446RE"

[build]
target = "thumbv7em-none-eabihf" # Cortex-M4

[alias]
# `cargo rb foo` will expand to `cargo run --bin foo`
rb = "run --bin"
# `cargo rrb foo` will expand to `cargo run --release --bin foo`
rrb = "run --release --bin"
